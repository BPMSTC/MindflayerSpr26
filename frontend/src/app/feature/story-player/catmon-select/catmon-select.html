<!-- Main content area with background pattern -->
<div class="background">
  <div class="catmon-selection">
    <!-- Page heading -->
    <h2>Choose your companion:</h2> 
    
    <!-- Instructions for the user -->
    <div class="instructions">
      <p>Select one of the three CatMon below to begin your journey. Each companion has unique traits that will affect your adventure. Click on a card to continue!</p>
    </div>
    
    <!-- Grid container for catmon cards -->
    <!-- *ngFor loops through the catmons array from the component -->
    <div class="catmon-grid">
      <!-- This div repeats for each catmon in the array (NarMon, KirMon, ShikaMon) -->
      <div class="catmon-card" *ngFor="let catmon of catmons">
        <div class="catmon-card-content">
          <!-- Dynamic image source using catmon.image property -->
          <img [src]="catmon.image" [alt]="catmon.alt" class="catmon-image"> 
          <!-- Dynamic heading using catmon.name property -->
          <h3>{{ catmon.name }}</h3>
          <!-- Dynamic description using catmon.description property -->
          <p>{{ catmon.description }}</p>
          <!-- Each CatMon links to its adventure -->
          <button *ngIf="catmon.name === 'NarMon'" class="select-button" routerLink="/narmon-adventure">Choose {{ catmon.name }}</button>
          <button *ngIf="catmon.name === 'KirMon'" class="select-button" routerLink="/kirmon-adventure">Choose {{ catmon.name }}</button>
          <button *ngIf="catmon.name === 'ShikaMon'" class="select-button" routerLink="/shikamon-adventure">Choose {{ catmon.name }}</button>
        </div>
      </div>
    </div>
    
    <!-- Navigation section -->
    <div class="navigation">
      <!-- Back button using routerLink directive to navigate to home page -->
      <button routerLink="/" class="back-button">← Back to Home</button>
    </div>
  </div>
</div>
