<div class="auth-page d-flex justify-content-center align-items-center">
  <div class="card auth-card shadow">
    <div class="card-body">
      <form (ngSubmit)="submit()" #f="ngForm">
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-control"
            [(ngModel)]="email"
            required
          />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            [(ngModel)]="password"
            required
          />
          <!--  Start of password visibility toggle, not implemented yet
          <div>
            <span>Show</span>
          </div>
          -->
        </div>

        @if (error()) {
        <div class="alert alert-danger py-2">{{ error() }}</div>
        }

        <button type="submit" class="btn btn-catmon w-100" [disabled]="f.invalid">
          Sign In
        </button>
      </form>
    </div>
    <div class="card-footer text-center">
      <small>New trainer? <a routerLink="/signup">Create an account</a></small>
    </div>
  </div>
</div>
