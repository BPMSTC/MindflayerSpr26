<div class="auth-page d-flex justify-content-center align-items-center">
  <div class="card auth-card shadow">
    <div class="card-body">
      <form (ngSubmit)="submit()" #f="ngForm">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            class="form-control"
            [(ngModel)]="username"
            required
            minlength="3"
          />
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-control"
            [(ngModel)]="email"
            required
          />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            [(ngModel)]="password"
            required
            minlength="6"
          />
        </div>

        @if (error()) {
        <div class="alert alert-danger py-2">{{ error() }}</div>
        }

        <button type="submit" class="btn btn-catmon w-100" [disabled]="f.invalid">
          Sign Up
        </button>
      </form>
    </div>
    <div class="card-footer text-center">
      <small>Already a trainer? <a routerLink="/login">Sign in</a></small>
    </div>
  </div>
</div>
