<header>
  <nav class="navbar navbar-expand-lg bg-body-tertiary px-3">

    <!-- Logo + Brand Name - routes to home page when clicked -->
    <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/">
      <img src="CatMon Logo.png" alt="Game Logo" width="30" height="30">
      Catmon
    </a>

    <!-- Hamburger toggle (shown on mobile) -->
    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarContent"
            aria-controls="navbarContent"
            aria-expanded="false"
            aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Collapsible content -->
    <div class="collapse navbar-collapse" id="navbarContent">

      <!-- Nav Links -->
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" routerLink="#">Home</a> <!--I think we could remove 'Home' if we can stylize the logo-->
        </li>
        <li>
          <a class="nav-link" routerLink="/catmon-select">Play</a>
        </li> 
        <li class="nav-item">
          <a class="nav-link" routerLink="/catdex">CatDex</a>
        </li>
      </ul>

      <!-- Sign In / Sign Out Button (pushed right on desktop) -->
      @if (auth.currentUser(); as user) {
        <span class="navbar-text ms-auto me-3 text-light">Hi, {{ user.username }}</span>
        <button class="btn btn-catmon-outline" (click)="signOut()">Sign Out</button>
      } @else {
        <button class="btn btn-catmon ms-auto" (click)="signIn()">Sign In</button>
      }

    </div>
  </nav>
</header>
